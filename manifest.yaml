  - "Slice 2, limit 4: E-01 and E-09 describe the same cohort: 3,654 adults in the UK military registry with complete data, 2006 to 2013, 47.6% Priority 1."
  - "Slice 2, limit 5: Axis 7 belongs to the generator's mix still more than axis 1 does, because net benefit turns on the share in need."
  - "Slice 2, limit 6: The injured on which the rule is held to E-09 (cells 4, 12, 13 and 18; baseline.py lines 74 to 77 and 172 to 199) are the battle and non-battle streams."
  - "Slice 2, limit 7: Axis 7's diagnosis entry (decision.py lines 432 to 448) names its casualties only in part."
  - "Slice 2, limit 8: The transfusion line (rules.py lines 347 to 358) quotes E-31's 75% and 86% beneath a score whose scan item is the generator's scan in the setting selected."
  - "Slice 2, limit 9: E-09 scores the rule against the registry's Priority 1, which its row does not define."
  - "Slice 2, limit 10: E-90 does not say at what score the ABC score's 0.36 and 0.80 were measured."
  - "Slice 2, limit 11: The notebook's figures and the panel count casualties whom the generator has dead from bleeding before pre-hospital care."
  - "Slice 2, limit 12: The ABC score's pressure item reads a systolic pressure drawn from assumed parameters with no published target (`sbp_bleeding` and `sbp_not_bleeding`; generator.py lines 310 to 313)."
  - "Slice 2, limit 13: Where the rule's misses land is set by an assumption."
  - "Slice 2, limit 14: E-104's figures come from CT of 100 male military cases; the harcke2007 note gives them as virtual-autopsy cases measured horizontally, with a perpendicular mean of 4.86 cm (SD 1.10) that the register does not hold."
  - "Slice 2, limit 15: Cell 34 quotes E-106 as the register records it and ends \"The record points the same way as the measurements\"."
  - "Slice 2, limit 16: The tranexamic acid line (rules.py lines 363 to 370) gives the casualty's time to pre-hospital care, the generator's assumption (`time_to_phec_min`), which the generator takes as the time the drug is given, and calls it neither; the page's closing caption, which calls every figure on the page a ...."
  - "Slice 2, limit 17: The transfusion line ends \"the Bayesian panel's belief after the scan is\" a percentage, without saying what the belief is in."
  - "Slice 2, limit 18: The baseline column of the treatment rows (cells 21, 42, 43) is the MPTT-24's Priority 1, a triage output, scored against significant bleeding; cell 42 says so."
  - "Slice 2, limit 19: Axis 7's \"treat all\" and \"treat none\" are net benefit's names for flagging every casualty and none (decision.py lines 91 to 93), not a treatment."
  - "Slice 2, limit 20: The priority line reads \"Reading the paper's text, where anything below alert is Priority 1\" (rules.py line 338)."
  - "Slice 2, limit 21: The panel's caption (rules.py lines 372 to 377) opens with \"(E-09, E-11)\" on how the figures were measured."
  - "Slice 2, limit 22: The scorecard (cells 41 and 43; rules.py lines 249 to 257 and 267 to 313) gives the MPTT-24 under the figure reading only."
  - "Slice 2, limit 23: Axis 7's comparisons come from one sample, seed 42, and no spread across seeds is reported, as standing lesson 12 asks."
  - "Slice 2, limit 24: Cell 17's \"Most who respond to voice have a fast pulse or an abnormal respiratory rate, or are walking\" gives as \"most\" a count the notebook does not print: 3,046 of the 3,930 who respond only to voice (77.5%), or 3,054 (77.7%) with those bleeding catastrophically, who are also sorted the same ...."

